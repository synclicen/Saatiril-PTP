name: Saatiril MC

# Builds the MC-only APK (no Admin, no Operator — BLE Remote only).
# MC can ONLY do: scan BLE → connect → PANGGIL/NEXT/RESET.
# No access to Admin panel, Operator camera, or license.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saatiril-mc.yml'
      - 'android-app/src/**'
      - 'android-app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mc:
    name: Build MC-Only APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (manual — bypass XR license bug)
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mc-${{ hashFiles('**/*.gradle*', 'gradle.properties') }}
          restore-keys: gradle-mc-

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.SAATIRIL_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > saatiril-release.keystore
          echo "KEYSTORE_FILE=saatiril-release.keystore" >> $GITHUB_ENV

      - name: Create keystore.properties
        if: env.KEYSTORE_FILE != ''
        run: |
          cat > keystore.properties << EOF
          storeFile=saatiril-release.keystore
          storePassword=${{ secrets.SAATIRIL_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.SAATIRIL_KEY_ALIAS }}
          keyPassword=${{ secrets.SAATIRIL_KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build MC Debug APK
        run: ./gradlew assembleMcDebug --no-daemon --stacktrace

      - name: Build MC Release APK (signed)
        if: env.KEYSTORE_FILE != ''
        run: ./gradlew assembleMcRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          # Find MC debug APK
          MC_DEBUG=$(find android-app/build/outputs/apk/mc/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$MC_DEBUG" ]; then
            cp "$MC_DEBUG" saatiril-mc-debug.apk
            echo "Debug APK: $(ls -lh saatiril-mc-debug.apk)"
          fi

          # Find MC release APK (if signed)
          MC_RELEASE=$(find android-app/build/outputs/apk/mc/release -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$MC_RELEASE" ]; then
            cp "$MC_RELEASE" saatiril-mc.apk
            echo "Release APK: $(ls -lh saatiril-mc.apk)"
          else
            # No release APK (no keystore) — use debug as the main APK
            cp saatiril-mc-debug.apk saatiril-mc.apk
            echo "Using debug APK as release (no keystore)"
          fi

          ls -lh saatiril-mc*.apk

      - name: Upload MC Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: saatiril-mc-debug
          path: saatiril-mc-debug.apk
          if-no-files-found: warn

      - name: Upload MC Release APK
        uses: actions/upload-artifact@v4
        with:
          name: saatiril-mc-release
          path: saatiril-mc.apk
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if 'latest' release exists
          if gh release view latest 2>/dev/null; then
            echo "Release 'latest' exists — uploading MC APKs"
            gh release delete-asset latest saatiril-mc.apk --yes 2>/dev/null || true
            gh release delete-asset latest saatiril-mc-debug.apk --yes 2>/dev/null || true
            gh release upload latest saatiril-mc.apk saatiril-mc-debug.apk --clobber
          else
            echo "Creating 'latest' release with MC APKs"
            gh release create latest saatiril-mc.apk saatiril-mc-debug.apk \
              --title "Saatiril PTP - Latest Build" \
              --notes "MC-Only APK (BLE Remote) - Build #${{ github.run_number }}" \
              --prerelease
          fi
          echo "=== MC APKs published to releases ==="

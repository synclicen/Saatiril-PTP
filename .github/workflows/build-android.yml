name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Default GITHUB_TOKEN needs explicit write permission to create releases
# and upload assets. Without this, `gh release create` returns HTTP 403
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (manual — bypass XR license bug)
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          # Accept all licenses (including new XR SDK license that breaks setup-android)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          # Install needed SDK packages
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ── Decode release signing keystore ──────────────────────────
      # The keystore + passwords are stored as GitHub Actions secrets
      # (uploaded once via the GitHub API). We base64-decode the keystore
      # to a file and write keystore.properties so build.gradle.kts can
      # pick it up via the `signingConfigs.release` block.
      - name: Decode release keystore
        env:
          SAATIRIL_KEYSTORE_BASE64: ${{ secrets.SAATIRIL_KEYSTORE_BASE64 }}
          SAATIRIL_KEYSTORE_PASSWORD: ${{ secrets.SAATIRIL_KEYSTORE_PASSWORD }}
          SAATIRIL_KEY_ALIAS: ${{ secrets.SAATIRIL_KEY_ALIAS }}
          SAATIRIL_KEY_PASSWORD: ${{ secrets.SAATIRIL_KEY_PASSWORD }}
        run: |
          if [ -z "$SAATIRIL_KEYSTORE_BASE64" ]; then
            echo "::warning::SAATIRIL_KEYSTORE_BASE64 secret is not set — release APK will be UNSIGNED and Android will refuse to install it."
            exit 0
          fi
          echo "$SAATIRIL_KEYSTORE_BASE64" | base64 -d > saatiril-release.keystore
          cat > keystore.properties <<EOF
          storeFile=saatiril-release.keystore
          storePassword=$SAATIRIL_KEYSTORE_PASSWORD
          keyAlias=$SAATIRIL_KEY_ALIAS
          keyPassword=$SAATIRIL_KEY_PASSWORD
          EOF
          echo "Keystore decoded:"
          ls -l saatiril-release.keystore

      - name: Build Full Debug APK
        run: ./gradlew assembleFullDebug --no-daemon --stacktrace

      - name: Build Full Release APK (signed)
        run: ./gradlew assembleFullRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          # Product flavors: APKs are in flavor-scoped subdirectories
          DEBUG_APK=$(find android-app/build/outputs/apk/full/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$DEBUG_APK" ]; then
            DEBUG_APK=$(find android-app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          fi
          cp "$DEBUG_APK" artifacts/saatiril-andro-debug.apk
          RELEASE_APK=$(find android-app/build/outputs/apk/full/release -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$RELEASE_APK" ]; then
            RELEASE_APK=$(find android-app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" artifacts/saatiril-andro.apk
          else
            echo "No release APK found"
            exit 1
          fi
          ls -lh artifacts/

      # ── Verify the release APK is actually signed ────────────────
      # An unsigned APK is rejected by Android's installer (the bug we fixed
      # in this build). Fail the build loudly if there's no v2 signing block.
      - name: Verify release APK signature
        run: |
          if ! command -v apksigner >/dev/null 2>&1; then
            APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          else
            APKSIGNER="apksigner"
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs artifacts/saatiril-andro.apk || {
            echo "::error::Release APK signature verification FAILED — the APK is unsigned and Android will refuse to install it."
            exit 1
          }
          echo "✅ Release APK is signed and installable."

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saatiril-andro-android-debug
          path: artifacts/saatiril-andro-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saatiril-andro-android-release
          path: artifacts/saatiril-andro.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the 'latest' release if it doesn't exist yet (ignore error if it does).
          # Then upload/replace the APK assets with --clobber.
          ASSETS=""
          if [ -f artifacts/saatiril-andro.apk ]; then
            ASSETS="artifacts/saatiril-andro.apk artifacts/saatiril-andro-debug.apk"
          else
            ASSETS="artifacts/saatiril-andro-debug.apk"
          fi
          echo "Assets to publish: $ASSETS"

          gh release create latest \
            --title "Saatiril PTP - Latest Build" \
            --notes "Auto-built APK from commit ${GITHUB_SHA::7}" \
            --prerelease --target main $ASSETS 2>/tmp/create.err || true

          if grep -q "already exists" /tmp/create.err 2>/dev/null; then
            echo "Release 'latest' already exists — uploading assets with --clobber"
            gh release upload latest $ASSETS --clobber
          else
            cat /tmp/create.err 2>/dev/null || true
            # Verify assets are actually attached (create may succeed but upload nothing
            # if assets were rejected). Re-upload to be safe.
            gh release upload latest $ASSETS --clobber 2>/dev/null || true
          fi

          echo "=== Release assets ==="
          gh release view latest --json assets -q '.assets[].name' || true

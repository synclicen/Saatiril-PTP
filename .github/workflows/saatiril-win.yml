name: Saatiril Win

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saatiril-win.yml'
      - 'electron/**'
      - 'src/**'
      - 'public/**'
      - 'prisma/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source (Saatiril-PTP)
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1
      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1
      - name: Enable Next.js static export
        shell: pwsh
        run: |
          $configPath = "next.config.ts"
          $content = Get-Content $configPath -Raw
          $content = $content -replace '// output: "export",', 'output: "export",'
          Set-Content $configPath $content -NoNewline
      - name: Remove API route
        shell: pwsh
        run: |
          $apiDir = "src/app/api"
          if (Test-Path $apiDir) { Remove-Item -Recurse -Force $apiDir }
      - name: Build Next.js
        run: npx next build
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: 1
          NEXT_TELEMETRY_DISABLED: 1
      - name: Verify static export
        shell: pwsh
        run: |
          if (Test-Path "out/index.html") {
            $fc = (Get-ChildItem "out" -Recurse -File).Count
            Write-Host "Static export OK ($fc files)"
          } else { Write-Error "out/index.html NOT found!"; exit 1 }
      - name: Verify mc.html has v11 + photoshoot UI
        shell: pwsh
        run: |
          $mc = Get-Content "out/mc.html" -Raw
          if ($mc -match 'v24-client-sync-fix') { Write-Host "mc.html v11 - OK" }
          else { Write-Error "mc.html v11 NOT found!"; exit 1 }
          if ($mc -match 'renderPhotoshoot' -and $mc -match 'KIRIM KE OPERATOR') { Write-Host "mc.html photoshoot UI - OK" }
          else { Write-Error "mc.html photoshoot UI NOT found!"; exit 1 }
          if ($mc -match 'callStatus = data.student.status') { Write-Host "mc.html MC_CALL uses data.student.status - OK" }
          else { Write-Error "mc.html MC_CALL fix NOT found!"; exit 1 }
      - name: Verify operator.html
        shell: pwsh
        run: |
          $op = Get-Content "out/operator.html" -Raw
          if ($op -match 'v24-client-sync-fix') { Write-Host "operator.html v11 - OK" }
          else { Write-Error "operator.html v11 NOT found!"; exit 1 }
      - name: Compile Electron preload
        run: npx tsc -p electron/tsconfig.json
      - name: Bundle Electron main
        run: npx esbuild electron/main.ts --bundle --platform=node --outfile=electron/main.js --external:electron --external:buffer --external:fs --external:path --external:os --external:http --external:https --external:net --external:crypto --external:stream --external:events --external:url --external:child_process --external:dns --external:tls --external:zlib --external:string_decoder
      - name: Build Electron app
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload to releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          REPO="${{ github.repository }}"
          PORTABLE=$(find dist-electron -name "*-Portable.exe" | head -1)
          cp "$PORTABLE" dist-electron/saatiril-portable.exe
          ASSET_NAME="saatiril-portable.exe"

          # Robust helper: delete an existing release asset by NAME using the
          # GitHub REST API + jq. `gh release delete-asset ... 2>/dev/null || true`
          # silently swallows delete failures (pagination quirks, transient
          # errors), leaving `gh release upload --clobber` to crash with HTTP
          # 422 "ReleaseAsset.name already exists". This function fetches the
          # release JSON, resolves the asset ID by exact name match, and
          # DELETEs it directly by ID. Safe to call when the asset is absent.
          # jq is pre-installed on all GitHub Actions runners (incl. windows).
          delete_asset_by_name() {
            local name="$1"
            local rel_json asset_id code
            rel_json=$(curl -sS -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/tags/latest")
            asset_id=$(printf '%s' "$rel_json" \
              | jq -r --arg n "$name" '.assets[] | select(.name==$n) | .id' 2>/dev/null \
              | head -1)
            if [ -n "$asset_id" ]; then
              echo "  Found existing $name (asset id: $asset_id) — deleting via API"
              code=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: token ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/releases/assets/${asset_id}")
              echo "  DELETE returned HTTP $code"
              # 204 = deleted, 404 = already gone — both fine.
              case "$code" in
                204|404) echo "  Existing $name removed (or already absent)";;
                *) echo "  WARNING: delete returned $code — will still try --clobber upload";;
              esac
            else
              echo "  No existing $name found on release — nothing to delete"
            fi
          }

          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            echo "=== Release 'latest' exists — replacing $ASSET_NAME ==="
            delete_asset_by_name "$ASSET_NAME"
            # Belt-and-suspenders: --clobber lets gh retry if a same-named
            # asset reappeared between our delete and the upload.
            gh release upload latest "dist-electron/${ASSET_NAME}" --clobber --repo "$REPO"
          else
            echo "=== Release 'latest' does NOT exist — creating ==="
            gh release create latest "dist-electron/${ASSET_NAME}" \
              --title "Saatiril PTP - Latest" \
              --notes "Build #${{ github.run_number }}" \
              --prerelease --repo "$REPO"
          fi
          echo "=== Upload step finished ==="
